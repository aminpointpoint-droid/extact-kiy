<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>شماره‌گذار پاسخ تست‌ها</title>
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --ink: #1c2420;
    --muted: #66736b;
    --line: #d5ddd7;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --mark: #fff2c2;
    --mark-ink: #4a3b00;
    --err: #b3261e;
    --app-h: 100dvh;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17;
      --surface: #1c2420;
      --ink: #e8efea;
      --muted: #98a79e;
      --line: #2f3b35;
      --accent: #5cc4a6;
      --accent-ink: #0d1a15;
      --mark: #4a3f12;
      --mark-ink: #ffe9a0;
      --err: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
    line-height: 1.6;
  }

  .app {
    height: var(--app-h);
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Top: start test number + its answer, separate from the answers field */
  .top {
    flex: 0 0 auto;
    display: flex;
    align-items: end;
    gap: .5rem;
    padding: .6rem 1rem .4rem;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .field { display: flex; flex-direction: column; gap: .1rem; }
  .field.num { flex: 1 1 0; }
  .field.ans { flex: 0 0 4.2rem; }
  label { font-size: .75rem; color: var(--muted); }
  input, textarea {
    font: inherit;
    font-size: 16px; /* prevents iOS zoom on focus */
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: .4rem .6rem;
    width: 100%;
  }
  .top input { text-align: center; font-weight: 700; font-size: 18px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: .3rem .7rem;
    white-space: nowrap;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    padding: .3rem 1rem;
    font-size: .85rem;
    color: var(--muted);
  }
  .bar.error { color: var(--err); }
  .bar-btns { display: flex; gap: .4rem; }

  #results {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: .25rem 1rem .75rem;
    -webkit-overflow-scrolling: touch;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: .45rem;
  }
  .cell {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .4rem;
    padding: .4rem .65rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cell .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; }
  .cell .a { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cell.start { border-color: var(--accent); }
  .cell.five { border-bottom: 3px solid var(--accent); }
  .cell.done { background: var(--mark); color: var(--mark-ink); }
  .cell.done .n { color: inherit; opacity: .7; }

  /* Bottom: only the answers field, right above the number keypad */
  .dock {
    flex: 0 0 auto;
    display: flex;
    gap: .5rem;
    align-items: stretch;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: .5rem 1rem calc(.5rem + env(safe-area-inset-bottom, 0px));
  }
  textarea {
    flex: 1 1 auto;
    height: 3.6rem;
    resize: none;
    letter-spacing: .12em;
    direction: ltr;
    text-align: left;
    font-size: 18px;
  }
  .dock button { align-self: stretch; }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top">
    <div class="field num">
      <label for="startNum">شمارهٔ تست شروع</label>
      <input id="startNum" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" value="300" autocomplete="off">
    </div>
    <div class="field ans">
      <label for="startAns">جواب آن</label>
      <input id="startAns" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" enterkeyhint="next" value="2" autocomplete="off">
    </div>
  </div>

  <div id="status" class="bar" role="status">
    <span id="statusText"></span>
    <span class="bar-btns">
      <button id="copyBtn" class="primary" type="button">کپی</button>
      <button id="resetMarks" type="button">پاک‌کردن علامت‌ها</button>
    </span>
  </div>

  <div id="results"><div id="grid" class="grid"></div></div>

  <div class="dock">
    <textarea id="seq" inputmode="numeric" pattern="[0-9 ]*" enterkeyhint="done" placeholder="جواب‌های بعدی: 1 3 4 1" autocomplete="off"></textarea>
    <button id="clearBtn" type="button">پاک</button>
  </div>
</div>

<script>
(function () {
  var app = document.getElementById("app");
  var startNum = document.getElementById("startNum");
  var startAns = document.getElementById("startAns");
  var seq = document.getElementById("seq");
  var grid = document.getElementById("grid");
  var results = document.getElementById("results");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var items = [];
  var marked = {};

  /* Keep the app exactly as tall as the space above the keyboard */
  var vv = window.visualViewport;
  function fit() {
    var h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--app-h", h + "px");
    if (vv) window.scrollTo(0, 0);
  }
  if (vv) {
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", fit);
  }
  window.addEventListener("resize", fit);
  fit();

  function toEnglishDigits(s) {
    return s
      .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 1776); })
      .replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 1632); });
  }

  /* Digits only (spaces allowed where asked) */
  function cleanField(el, allowSpace) {
    var v = toEnglishDigits(el.value);
    v = v.replace(allowSpace ? /[^0-9\s]/g : /[^0-9]/g, "");
    if (v !== el.value) el.value = v;
  }

  function parseSeq(raw) {
    var out = [];
    raw.split(/\s+/).filter(Boolean).forEach(function (p) {
      p.split("").forEach(function (c) { out.push(c); });
    });
    return out;
  }

  function render(scrollToEnd) {
    var n = parseInt(startNum.value, 10);
    var a = startAns.value.trim();
    grid.innerHTML = "";
    items = [];
    statusEl.classList.remove("error");

    if (isNaN(n)) {
      statusText.textContent = "شمارهٔ تست شروع را وارد کنید.";
      statusEl.classList.add("error");
      return;
    }
    if (!a) {
      statusText.textContent = "جواب تست شروع را وارد کنید.";
      statusEl.classList.add("error");
      return;
    }

    var all = [a].concat(parseSeq(seq.value));
    all.forEach(function (ans, i) { items.push({ num: n + i, ans: ans }); });

    var frag = document.createDocumentFragment();
    items.forEach(function (it, i) {
      var d = document.createElement("div");
      d.className = "cell" + (i === 0 ? " start" : "") + ((i + 1) % 5 === 0 ? " five" : "") + (marked[it.num] ? " done" : "");
      d.tabIndex = 0;
      d.setAttribute("role", "button");
      d.innerHTML = '<span class="n">' + it.num + '</span><span class="a">' + it.ans + '</span>';
      function toggle() {
        marked[it.num] = !marked[it.num];
        d.classList.toggle("done", !!marked[it.num]);
      }
      d.addEventListener("click", toggle);
      d.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
      frag.appendChild(d);
    });
    grid.appendChild(frag);

    statusText.textContent = items.length + " پاسخ، تست " + n + " تا " + items[items.length - 1].num;
    if (scrollToEnd) results.scrollTop = results.scrollHeight;
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    if (!items.length) return;
    var text = items.map(function (it) { return it.num + "\t" + it.ans; }).join("\n");
    var btn = this;
    function ok() {
      var old = btn.textContent;
      btn.textContent = "شد";
      setTimeout(function () { btn.textContent = old; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () {});
    } else {
      var t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); ok(); } catch (e) {}
      document.body.removeChild(t);
    }
  });

  document.getElementById("resetMarks").addEventListener("click", function () {
    marked = {};
    render(false);
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    seq.value = "";
    marked = {};
    render(false);
    seq.focus();
  });

  startNum.addEventListener("input", function () { cleanField(startNum, false); render(false); });
  startAns.addEventListener("input", function () { cleanField(startAns, false); render(false); });
  seq.addEventListener("input", function () { cleanField(seq, true); render(true); });

  startNum.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); startAns.focus(); }
  });
  startAns.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); seq.focus(); }
  });
  seq.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); seq.blur(); }
  });

  render(false);
})();
</script>
</body>
</html>
